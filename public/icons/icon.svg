<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="vibeRedGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff2a4b" />
      <stop offset="70%" stop-color="#e60026" />
      <stop offset="100%" stop-color="#b3001a" />
    </radialGradient>
    <filter id="vibeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff0033" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Red circular disc -->
  <circle cx="250" cy="250" r="200" fill="url(#vibeRedGrad)" filter="url(#vibeGlow)" />

  <!-- Outer white curved ring arc -->
  <path d="M 250 85 A 165 165 0 1 1 133 133" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

  <!-- Play Triangle -->
  <polygon points="215,175 325,250 215,325" fill="#ffffff" />
</svg>